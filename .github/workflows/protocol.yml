name: Verify Solana protocol

on:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - "contracts/**"
      - ".github/workflows/protocol.yml"
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/protocol.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Anchor build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
          cache-on-failure: true

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Report Solana CLI version
        run: solana --version

      - name: Install Anchor Version Manager
        run: |
          cargo install --git https://github.com/solana-foundation/anchor avm --locked
          avm install 1.0.2
          avm use 1.0.2
          anchor --version

      - name: Install protocol JavaScript dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          fi

      # The SBF build must come first: the LiteSVM integration tests load
      # target/deploy/*.so, and skip themselves if it is absent. With the old
      # ordering they silently reported "0 passed" and proved nothing.
      - name: Build Anchor workspace
        run: anchor build --ignore-keys

      # Unit tests, fuzz properties, and LiteSVM access-control tests.
      # PERSAT_REQUIRE_PROGRAMS turns a missing .so into a hard failure so the
      # integration tests can never silently no-op in CI again.
      - name: Run unit, fuzz, and integration tests
        env:
          PERSAT_REQUIRE_PROGRAMS: "1"
        run: cargo test --workspace

  coverage:
    name: Pass 1 coverage measurement and floors
    runs-on: ubuntu-latest
    needs: protocol
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
          cache-on-failure: true

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor Version Manager
        run: |
          cargo install --git https://github.com/solana-foundation/anchor avm --locked
          avm install 1.0.2
          avm use 1.0.2

      # Same ordering discipline as the test job: the LiteSVM suites must not
      # silently no-op, and they are a large part of the exercised surface.
      - name: Build Anchor workspace
        run: anchor build --ignore-keys

      # llvm-cov needs its own profile so instrumentation does not leak into
      # the SBF build; --workspace covers every program plus persat-core.
      - name: Measure coverage
        env:
          PERSAT_REQUIRE_PROGRAMS: "1"
        run: |
          cargo llvm-cov --workspace \
            --summary-only \
            --output-path coverage-summary.json
          cargo llvm-cov --workspace \
            --lcov \
            --output-path coverage.lcov
          cat coverage-summary.json

      # Ground truth from the first full measurement of this workspace
      # (run 32771896605 on main, 2026-08-24): workspace lines 57.51%
      # (1858/3231) and persat-core 97.83% (767/784). The LiteSVM suites
      # execute the SBF .so blobs inside a VM, so they prove program behavior
      # but cannot attribute host coverage to the program crates:
      # escrow_vault, governance and liquidation_engine have no native unit
      # tests yet and measure ~0.5% despite their passing LiteSVM suites.
      #
      # Floors:
      # - persat-core (pure-Rust financial math) must stay >= 90% lines;
      #   it measures ~98% through unit and property tests alone.
      # - The workspace floor is an anti-regression gate at 55%, not a
      #   quality target. Raise it toward the 95% Pass 1 target as the
      #   programs gain native unit tests that llvm-cov can observe.
      - name: Enforce coverage floors
        run: |
          cargo llvm-cov --workspace --summary-only --fail-under-lines 55
          cargo llvm-cov -p persat-core --summary-only --fail-under-lines 90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-coverage
          path: |
            contracts/coverage-summary.json
            contracts/coverage.lcov
          retention-days: 90
