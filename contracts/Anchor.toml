[features]
resolution = true
skip-lint = false

[programs.localnet]
governance = "gSCWC42bnn8XbRNXt7FdoGPGqG5dkfMihqYj8xhGwuj"
price_oracle = "8udyx5YywfH7KTk6WyaECzaqenyni4JQrWpF5y774qgc"
asset_whitelist = "F9m5MaeNeLurf1A3fuwL9EEP6ZNJ6e46UqnW26LvjqSe"
deal_registry = "2jGypEsuyB31ZFUfgLvLLEEAJHdWdMoVimeWWTrzGks2"
escrow_vault = "ETZyNBxrn43GApFkiAwfEimzWC93P7nEdSQMcT8Snmy3"
loan_lifecycle = "HLsDiU1oABybsQhXxnodvoG9tngwTDZGeKwMG5i9Lo3p"
liquidation_engine = "C2nL9d8EyyeEz5XQiJVLACMjN9S8GVBvxV9FQ65VTtUx"
fee_treasury = "Gnq8qb2Rmnua296VcQ7KHZsuav5ZnWTsP39xCYv8aK5V"

[provider]
# Devnet is the MVP target cluster. See contracts/config/devnet.json for the
# reasoning: Solana testnet is for validator operators, and the Pyth receiver
# is not deployed there, so the protocol would have no BTC/USD price at all.
cluster = "Devnet"
# CI has no user wallet. `anchor build` generates a throwaway program keypair in
# target/deploy (gitignored, regenerated per run), which satisfies the provider
# without ever committing a key. No deployment uses this wallet.
wallet = "target/deploy/asset_whitelist-keypair.json"

[workspace]
members = [
  "programs/governance",
  "programs/price_oracle",
  "programs/asset_whitelist",
  "programs/deal_registry",
  "programs/escrow_vault",
  "programs/loan_lifecycle",
  "programs/liquidation_engine",
  "programs/fee_treasury",
]

# solana-test-validator 3.1.10 panics when bound to 0.0.0.0 on hosted runners.
[test.validator]
bind_address = "127.0.0.1"

[scripts]
test = "cargo test --workspace -- --nocapture"
