[package]
name = "asset_whitelist"
version = "0.1.0"
description = "Persat Finance Asset Whitelist Registry"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "asset_whitelist"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
custom-heap = []
custom-panic = []
anchor-debug = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=1.0.0"
anchor-spl = "=1.0.0"
